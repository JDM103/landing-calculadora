<!DOCTYPE html>
<!-- ============================================================================
/r/<alias> · dashboard de autogestión de cada cliente (Empowered Investor)
- El cliente entra con su clave (function `reporte` de ei-sistema) y ve su cuenta:
  freedom point, mezcla vs gradiente de riesgo, señal M39 con el punto de salida
  en el gráfico, aportes plan vs realidad, posiciones y qué hacer ahora.
- La matemática de la mezcla (fw + candado del pico) es IDÉNTICA a /mi-plan y /fpf.
  Si cambia allá, cambia acá.
- #demo: maqueta con datos inventados y selector de escenario (sin backend).
- En producción el alias viene de la URL (/r/mv-07/ vía redirect de Netlify);
  en local host se pasa con ?a=mv-07.
============================================================================= -->

  .todo-bien{ display:flex; align-items:center; gap:10px; background:rgba(99,252,175,.06);

  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:50; display:none;

  .modal.on{ display:flex; }
  .modal .caja2{ background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:22px 20px 18px;

  .modal h3{ margin:0 0 6px; font-size:18px; color:var(--crema); }
  .modal .sub3{ font-size:13px; color:var(--gris-sec); margin-bottom:12px; }
  .pasos{ list-style:none; margin:0 0 6px; padding:0; counter-reset:paso; }
  .pasos li{ position:relative; padding:10px 12px 10px 44px; background:var(--card2); border:1px solid var(--bd);

  .pasos li b{ color:var(--crema); }
  .pasos li::before{ content:counter(paso); position:absolute; left:12px; top:50%; transform:translateY(-50%);

  .modal .btns .no{ background:transparent; color:var(--gris); }

  details.hist{ margin:12px 0; }
  details.hist summary{ cursor:pointer; font-size:13px; font-weight:700; color:var(--gris-sec); padding:4px 2px; }

  .pie{ margin-top:30px; font-size:11.5px; color:#6b7280; line-height:1.6; text-align:center; }
  .pie a{ color:#6b7280; }
</style>

<script>
"use strict";
var BASE="https://jsjhfiakinodosesdqum.supabase.co/functions/v1";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzamhmaWFraW5vZG9zZXNkcXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjY5NTQsImV4cCI6MjEwMTY0Mjk1NH0.MfXXQ6QFx_OudI5Bj9Sr7yw5PRTv_O45NQ_X24tuqLU";

/* ================= utilidades ================= */
function $(id){ return document.getElementById(id); }
function fmt(n){ var s=n<0?"−":""; return s+"$"+Math.abs(Math.round(n)).toLocaleString("en-US"); }
function money(n){ n=Math.round(n); var s=n<0?"-":""; n=Math.abs(n);
  if(n>=1e6) return s+"$"+(n/1e6).toFixed(2)+"M";
  if(n>=1e4) return s+"$"+Math.round(n/1e3).toLocaleString("en-US")+"k";
  return s+"$"+n.toLocaleString("en-US"); }
function pct(n){ return (n>=0?"+":"−")+Math.abs(n).toFixed(1)+"%"; }
function cls(n){ return n>=0?"up":"down"; }
function esc(t){ return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
function mesLargo(iso){ var d=new Date(iso+"T00:00:00Z"); return MESES[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function mesCorto(iso){ return ["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"][new Date(iso+"T00:00:00Z").getUTCMonth()]; }

/* Mezcla por avance, COPIADA de /mi-plan (y de /fpf fwW). No tocar sin tocar las de allá. */
function fw(phi, p1, p2, Ff){
  var wL,wE,wF; p1/=100; p2/=100; Ff/=100; if(p2<=p1)p2=p1+0.01;
  if(phi<=p1){ wL=1-phi/p1; wE=phi/p1; wF=0; }
  else if(phi<=p2){ var u=(phi-p1)/(p2-p1); wF=Ff*u; wL=0; wE=1-wF; }
  else { wL=0; wF=Ff; wE=1-Ff; }
  return [wL,wE,wF];
}

var DEMO = location.hash.indexOf("demo")===0 || location.hash==="#demo";
var ALIAS = (function(){
  var q=new URLSearchParams(location.search).get("a"); if(q) return q.toLowerCase();
  var m=location.pathname.match(/^\/r\/([a-z0-9-]+)/i); if(m && m[1].toLowerCase()!=="index.html") return m[1].toLowerCase();
  return null;
})();
var D=null;            // datos del cliente (respuesta de `reporte` + derivados)
var ESCENARIO="normal";

/* ================= derivados del plan ================= */
function derivar(d){
  var m=d.meta||{}, plan=m.plan||{f1:"TQQQ",f2:"SPY",f3:"—",p1:70,p2:100,ff:70,timing:true};
  var snaps=d.snapshots||[];
  var snap=snaps.length? snaps[snaps.length-1] : null;
  var fp = m.fp || (m.ingreso? m.ingreso*12/((m.tasa||4)/100) : 0);
  var equity=snap? +snap.equity:0, cash=snap? +snap.cash:0;
  var phi = fp>0? equity/fp : 0;
  var pico = phi;
  snaps.forEach(function(s){ if(+s.phi>pico) pico=+s.phi; });
  if(typeof d.pico==="number" && d.pico>pico) pico=d.pico;   // pico de toda la vida (cuando el backend lo mande)
  if(m.pico && m.pico>pico) pico=m.pico;

  // mezcla de hoy, en dólares
  var pos=(snap&&snap.posiciones)||[];
  var b={f1:0,f2:0,f3:0,otros:0,otrosSyms:[]};
  pos.forEach(function(p){
    if(p.s===plan.f1) b.f1+=p.v;
    else if(p.s===plan.f2) b.f2+=p.v;
    else if(p.s===plan.f3) b.f3+=p.v;
    else { b.otros+=p.v; b.otrosSyms.push(p.s); }
  });
  // mezcla objetivo con el candado de la Fase 3 (misma lógica de /mi-plan)
  var w=fw(pico*100, plan.p1||70, plan.p2||100, plan.ff||70);
  var total=equity;
  var tgt3=Math.max(b.f3, w[2]*total);
  var resto=Math.max(0,total-tgt3), w12=w[0]+w[1];
  var tgt1=w12>1e-9? resto*(w[0]/w12) : 0;
  var tgt2=resto-tgt1;
  var umbral=Math.max(500, total*0.02);

  return { m:m, plan:plan, snap:snap, snaps:snaps, fp:fp, equity:equity, cash:cash,
    phi:phi, pico:pico, b:b, tgt:{f1:tgt1,f2:tgt2,f3:tgt3}, umbral:umbral,
    cuenta:(snap&&snap.cuenta)||{} };
}

function faseDe(x){
  var p1=(x.plan.p1||70)/100, p2=(x.plan.p2||100)/100;
  if(x.pico<p1) return {t:"Fase 1 · crecimiento", c:"cf1"};
  if(x.pico<p2) return {t:"Fase 2 · bajando el riesgo", c:"cf2"};
  return {t:"Fase 3 · llegaste", c:"cf3"};
}

/* ================= acciones ================= */
function armarAcciones(x, senal){
  var acc=[];
  var timing=!!x.plan.timing;
  var fuera = senal && senal.estado==="fuera";
  var mesAct = x.snap? x.snap.mes.slice(0,7) : "";

  if(timing && fuera && (x.b.f1+x.b.f2)>x.umbral){
    acc.push({ id:"salir-"+(senal.semana||mesAct), urgente:true, ico:"🔴",
      t:"La señal dice: esta semana toca salir del mercado.",
      s:"Tu parte de mercado pasa a efectivo el lunes al abrir.",
      btn:"Ver los pasos",
      tit:"Pasar tu parte de mercado a efectivo",
      sub:"El viernes el mercado cerró abajo de la línea de salida. La regla es simple: se vende el lunes siguiente, apenas abre.",
      pasos:[
        "El lunes, entre 7:30 y 8:00 am (hora CR), abrí tu cuenta de Alpaca.",
        x.b.f1>1? "Vendé todo tu <b>"+esc(x.plan.f1)+"</b> ("+fmt(x.b.f1)+").":null,
        x.b.f2>1? "Vendé todo tu <b>"+esc(x.plan.f2)+"</b> ("+fmt(x.b.f2)+").":null,
        "Tu "+esc(x.plan.f3)+" (renta fija) no se toca: ese es tu piso.",
        "La plata queda en efectivo dentro de tu cuenta, esperando la señal de reentrada."
      ].filter(Boolean),
      nota:"Cuando la señal vuelva a entrar (viernes a −6% o mejor), acá van a estar los pasos para comprar de vuelta." });
  }

  // aporte del mes
  var pactado=+x.m.aporte_pactado||0;
  if(pactado>0 && x.snap){
    var delMes=(x.snap.transferencias_mes||[]).reduce(function(s,t){ return s+Math.max(0,+t.monto||0); },0);
    if(delMes<pactado*0.9){
      var falta=pactado-delMes;
      acc.push({ id:"aporte-"+mesAct, ico:"💵",
        t:"Va "+fmt(delMes)+" de tu aporte de "+fmt(pactado)+" este mes.",
        s:"Te falta "+fmt(falta)+" para quedar al día.",
        btn:"Ver los pasos",
        tit:"Completar el aporte del mes",
        sub:"Tu plan asume "+fmt(pactado)+" por mes. Este mes llevás "+fmt(delMes)+".",
        pasos:[
          "Entrá a tu banco y transferí <b>"+fmt(falta)+"</b> a tu cuenta de Alpaca (la cuenta que ya tenés vinculada).",
          "En 1 a 3 días hábiles aparece como efectivo en tu cuenta.",
          "Cuando entre, volvé acá: esta página te dice exactamente dónde invertirlo."
        ],
        nota:"El aporte constante pesa más que cualquier acierto de mercado. Es la parte del plan que depende 100% de vos." });
    }
  }

  if(!(timing && fuera)){
    // efectivo sin invertir
    if(x.cash>x.umbral){
      var w12=x.tgt.f1+x.tgt.f2+x.tgt.f3>0;
      var pasosInv=[];
      var dc1=Math.max(0,x.tgt.f1-x.b.f1), dc2=Math.max(0,x.tgt.f2-x.b.f2), dc3=Math.max(0,x.tgt.f3-x.b.f3);
      var sumd=dc1+dc2+dc3||1;
      var m1=x.cash*dc1/sumd, m2=x.cash*dc2/sumd, m3=x.cash*dc3/sumd;
      if(m1>=1) pasosInv.push("Comprá <b>"+fmt(m1)+"</b> de <b>"+esc(x.plan.f1)+"</b>.");
      if(m2>=1) pasosInv.push("Comprá <b>"+fmt(m2)+"</b> de <b>"+esc(x.plan.f2)+"</b>.");
      if(m3>=1) pasosInv.push("Pasá <b>"+fmt(m3)+"</b> a <b>"+esc(x.plan.f3)+"</b> (tu renta fija).");
      if(!pasosInv.length) pasosInv.push("Comprá <b>"+fmt(x.cash)+"</b> de <b>"+esc(x.plan.f1)+"</b>.");
      pasosInv.unshift("Abrí tu cuenta de Alpaca en un día de mercado abierto (lunes a viernes, 7:30 am a 2:00 pm CR).");
      acc.push({ id:"invertir-"+mesAct+"-"+Math.round(x.cash/100), ico:"🌱",
        t:"Tenés "+fmt(x.cash)+" en efectivo sin trabajar.",
        s:"Tu plan dice dónde va, según tu mezcla de hoy.",
        btn:"Ver dónde va",
        tit:"Poner tu efectivo a trabajar",
        sub:"La plata quieta pierde contra la inflación. Así se reparte "+fmt(x.cash)+" según tu mezcla:",
        pasos:pasosInv,
        nota:"Usá órdenes de mercado por monto en dólares (Alpaca permite fracciones). No hay que atinarle al momento: el plan ya decidió por vos." });
    }
    // rebalanceo
    var d1=x.tgt.f1-x.b.f1, d2=x.tgt.f2-x.b.f2, d3=x.tgt.f3-x.b.f3;
    var necesita=Math.max(Math.abs(d1),Math.abs(d2),Math.abs(d3))>=x.umbral && (Math.abs(d1)+Math.abs(d2)+Math.abs(d3))>x.cash+x.umbral;
    if(necesita){
      var pasosReb=[];
      if(x.b.otros>x.umbral) pasosReb.push("Vendé lo que está fuera del plan ("+esc(x.b.otrosSyms.join(", "))+", "+fmt(x.b.otros)+").");
      if(d1<-1) pasosReb.push("Vendé <b>"+fmt(-d1)+"</b> de "+esc(x.plan.f1)+".");
      if(d2<-1) pasosReb.push("Vendé <b>"+fmt(-d2)+"</b> de "+esc(x.plan.f2)+".");
      if(d1>1) pasosReb.push("Comprá <b>"+fmt(d1)+"</b> de "+esc(x.plan.f1)+".");
      if(d2>1) pasosReb.push("Comprá <b>"+fmt(d2)+"</b> de "+esc(x.plan.f2)+".");
      if(d3>1) pasosReb.push("Pasá <b>"+fmt(d3)+"</b> a "+esc(x.plan.f3)+" (renta fija).");
      acc.push({ id:"rebalance-"+mesAct, ico:"⚖️",
        t:"Tu mezcla se corrió de la del plan.",
        s:"Un ajuste y quedás de vuelta en tu gradiente de riesgo.",
        btn:"Ver el ajuste",
        tit:"Volver a tu mezcla",
        sub:"Con tu avance, tu mezcla objetivo es la de abajo en la sección \"Tu mezcla\". Este es el ajuste:",
        pasos:pasosReb,
        nota:"Tu renta fija nunca se vende: es el candado del plan. Solo se ajusta la parte de mercado." });
    } else if(x.b.otros>x.umbral){
      acc.push({ id:"otros-"+mesAct, ico:"🧹",
        t:"Tenés "+fmt(x.b.otros)+" en activos fuera del plan.",
        s:esc(x.b.otrosSyms.join(", "))+" no son parte de tu mezcla.",
        btn:"Ver qué hacer",
        tit:"Ordenar lo que está fuera del plan",
        sub:"No es urgente, pero el plan funciona mejor con las piezas del plan.",
        pasos:[
          "Vendé "+esc(x.b.otrosSyms.join(", "))+" ("+fmt(x.b.otros)+") en tu cuenta de Alpaca.",
          "Con ese efectivo, volvé acá: la página te dice dónde va según tu mezcla."
        ], nota:"" });
    }
  }
  return acc;
}

/* ================= gráfico de la señal ================= */
function prepCanvas(id){
  var cv=$(id); if(!cv) return null;
  var dpr=Math.max(1,window.devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  var g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  return {cv:cv,g:g,W:W,H:H};
}
function dibujarSenal(serie, sen, hover){
  var p=prepCanvas("cv-senal"); if(!p) return;
  var g=p.g, W=p.W, H=p.H;
  var c=serie.c, t=serie.t, n=c.length;
  // máximo móvil de 39 semanas (39 previas + la actual, como el backend)
  var max39=[], salida=[], reent=[];
  for(var i=0;i<n;i++){
    var d0=Math.max(0,i-39), mx=0;
    for(var j=d0;j<=i;j++) if(c[j]>mx) mx=c[j];
    max39.push(mx); salida.push(mx*0.82); reent.push(mx*0.94);
  }
  var padL=8,padR=86,padT=14,padB=22;
  var mn=Math.min(Math.min.apply(null,c), Math.min.apply(null,salida))*0.985;
  var mx2=Math.max.apply(null,max39)*1.01;
  var X=function(i){ return padL+(i/(n-1))*(W-padL-padR); };
  var Y=function(v){ return padT+(1-(v-mn)/(mx2-mn))*(H-padT-padB); };
  function linea(arr, color, ancho, dash){
    g.beginPath(); g.setLineDash(dash||[]);
    for(var i=0;i<n;i++){ if(i===0) g.moveTo(X(i),Y(arr[i])); else g.lineTo(X(i),Y(arr[i])); }
    g.strokeStyle=color; g.lineWidth=ancho; g.stroke(); g.setLineDash([]);
  }
  // zona bajo la línea de salida (zona de "afuera")
  g.beginPath(); g.moveTo(X(0),Y(salida[0]));
  for(var i2=1;i2<n;i2++) g.lineTo(X(i2),Y(salida[i2]));
  g.lineTo(X(n-1),H-padB); g.lineTo(X(0),H-padB); g.closePath();
  g.fillStyle="rgba(224,82,90,.07)"; g.fill();

  linea(max39,"#5a6270",1.2);
  linea(reent,"#7C8FF7",1.2,[5,4]);
  linea(salida,"#E0525A",1.6,[6,4]);
  linea(c,"#63FCAF",2);

  // punto y etiquetas del último cierre
  var ux=X(n-1);
  g.fillStyle="#FEF9F3"; g.beginPath(); g.arc(ux,Y(c[n-1]),4,0,7); g.fill();
  g.font="700 11px 'Bai Jamjuree'"; g.textAlign="left";
  function tag(y, txt, color){
    g.fillStyle=color; g.fillText(txt, W-padR+6, y+4);
  }
  tag(Y(c[n-1]), "hoy "+Math.round(c[n-1]).toLocaleString("en-US"), "#FEF9F3");
  tag(Y(salida[n-1]), "salida "+Math.round(salida[n-1]).toLocaleString("en-US"), "#E0525A");
  tag(Y(reent[n-1]), "reentrada", "#7C8FF7");
  // fechas extremos
  g.fillStyle="#9AA1AB"; g.font="10px 'Bai Jamjuree'"; g.textAlign="left";
  g.fillText(t[0], padL+2, H-7);
  g.textAlign="right"; g.fillText(t[n-1], W-padR-4, H-7);

  // hover
  if(typeof hover==="number" && hover>=0 && hover<n){
    var hx=X(hover);
    g.strokeStyle="rgba(255,255,255,.25)"; g.setLineDash([3,3]);
    g.beginPath(); g.moveTo(hx,padT); g.lineTo(hx,H-padB); g.stroke(); g.setLineDash([]);
    g.fillStyle="#FEF9F3"; g.beginPath(); g.arc(hx,Y(c[hover]),3.5,0,7); g.fill();
    var dv=(c[hover]/max39[hover]-1)*100;
    var txt=t[hover]+"  "+Math.round(c[hover]).toLocaleString("en-US")+"  ("+dv.toFixed(1)+"% del máx.)";
    g.font="700 11.5px 'Bai Jamjuree'";
    var tw=g.measureText(txt).width+14, bx=Math.min(Math.max(hx-tw/2,padL), W-padR-tw), by=padT+2;
    g.fillStyle="rgba(13,15,20,.94)"; g.strokeStyle="#2a3140";
    g.beginPath(); g.roundRect(bx,by,tw,20,6); g.fill(); g.stroke();
    g.fillStyle="#FEF9F3"; g.textAlign="left"; g.fillText(txt,bx+7,by+14);
  }
  p.cv.onmousemove=function(ev){
    var r=p.cv.getBoundingClientRect(), mxp=ev.clientX-r.left;
    var i3=Math.round((mxp-padL)/Math.max(1,(W-padL-padR))*(n-1));
    dibujarSenal(serie, sen, Math.max(0,Math.min(n-1,i3)));
  };
  p.cv.onmouseleave=function(){ dibujarSenal(serie, sen); };

  // texto de la regla con los números de hoy
  var el=$("regla-senal");
  if(el){
    var dist=(c[n-1]/max39[n-1]-1)*100;
    var dentro=!sen || sen.estado==="dentro";
    if(dentro){
      var caida=(salida[n-1]/c[n-1]-1)*100; // % que falta caer para tocar la salida
      el.innerHTML='La regla: si un viernes el Nasdaq cierra en la <b style="color:var(--rojo)">línea roja</b> o más abajo (−18% del máximo de 39 semanas), '
        +'<b>el lunes siguiente se sale a efectivo</b>. Hoy el cierre va <b class="num">'+Math.abs(dist).toFixed(1)+'%</b> abajo del máximo: '
        +'tendría que caer <b class="num">'+Math.abs(caida).toFixed(1)+'%</b> más (hasta '+Math.round(salida[n-1]).toLocaleString("en-US")+' puntos) para que toque salir. Nosotros lo vigilamos cada viernes y te avisamos.';
    } else {
      var subida=(reent[n-1]/c[n-1]-1)*100;
      el.innerHTML='Estás a resguardo. La regla de vuelta: cuando un viernes el Nasdaq cierre en la <b style="color:var(--peri)">línea azul</b> o más arriba (−6% del máximo), '
        +'<b>el lunes siguiente se reentra</b>. Hoy faltaría que suba <b class="num">'+Math.abs(subida).toFixed(1)+'%</b> (hasta '
        +Math.round(reent[n-1]).toLocaleString("en-US")+' puntos). Nosotros lo vigilamos cada viernes y te avisamos.';
    }
  }
}

/* ================= gráfico de la gradiente ================= */
function dibujarGradiente(x){
  var p=prepCanvas("cv-grad"); if(!p) return;
  var g=p.g, W=p.W, H=p.H;
  var padL=8,padR=8,padT=26,padB=24;
  var p1=x.plan.p1||70, p2=x.plan.p2||100, ff=x.plan.ff||70;
  var maxX=Math.max(110, x.pico*100+10);
  var X=function(phi){ return padL+(phi/maxX)*(W-padL-padR); };
  var Y=function(f){ return padT+(1-f)*(H-padT-padB); };
  // áreas apiladas: f1 abajo, f2 al medio, f3 arriba
  var paso=maxX/240;
  function area(hasta, color){
    g.beginPath(); g.moveTo(X(0),Y(0));
    for(var q=0;q<=maxX;q+=paso){ g.lineTo(X(q), Y(hasta(q))); }
    g.lineTo(X(maxX),Y(0)); g.closePath();
    g.fillStyle=color; g.fill();
  }
  // acumulados: w1; w1+w2; w1+w2+w3(=1)
  area(function(q){ return 1; }, "rgba(76,175,125,.55)");            // f3 (fondo total)
  area(function(q){ var w=fw(q,p1,p2,ff); return w[0]+w[1]; }, "rgba(91,200,176,.65)"); // f2
  area(function(q){ var w=fw(q,p1,p2,ff); return w[0]; }, "rgba(224,121,107,.8)");      // f1
  // hitos p1/p2
  g.strokeStyle="rgba(255,255,255,.14)"; g.setLineDash([3,4]);
  [p1,p2].forEach(function(hp){ g.beginPath(); g.moveTo(X(hp),padT-4); g.lineTo(X(hp),H-padB); g.stroke(); });
  g.setLineDash([]);
  g.fillStyle="#9AA1AB"; g.font="10px 'Bai Jamjuree'"; g.textAlign="center";
  g.fillText(p1+"%", X(p1), H-9);
  g.fillText("meta", X(p2), H-9);
  g.textAlign="left"; g.fillText("0%", X(0)+2, H-9);
  // marcador "estás acá" (en el pico, que es el que manda)
  var px=X(x.pico*100);
  g.strokeStyle="#FEF9F3"; g.lineWidth=2;
  g.beginPath(); g.moveTo(px,padT-6); g.lineTo(px,H-padB); g.stroke();
  g.fillStyle="#FEF9F3"; g.beginPath(); g.moveTo(px,padT-6); g.lineTo(px-5,padT-14); g.lineTo(px+5,padT-14); g.closePath(); g.fill();
  g.font="700 11px 'Bai Jamjuree'";
  var lbl="estás acá ("+(x.pico*100).toFixed(0)+"%)";
  var lw=g.measureText(lbl).width;
  var lx=Math.min(Math.max(px-lw/2, padL), W-padR-lw);
  g.fillText(lbl, lx, padT-16>10? padT-18+10 : 10);
}

/* ================= gráfico de aportes ================= */
function dibujarAportes(meses, pactado){
  var p=prepCanvas("cv-aportes"); if(!p) return;
  var g=p.g, W=p.W, H=p.H;
  var padL=8,padR=8,padT=18,padB=22;
  var n=meses.length;
  var mx=Math.max(pactado, Math.max.apply(null,meses.map(function(z){return z.ap;})),1)*1.15;
  var bw=Math.min(46,(W-padL-padR)/n*0.62);
  var X=function(i){ return padL+(i+0.5)*(W-padL-padR)/n; };
  var Y=function(v){ return padT+(1-v/mx)*(H-padT-padB); };
  meses.forEach(function(z,i){
    var ok=pactado<=0 || z.ap>=pactado*0.9;
    g.fillStyle= z.ap<=0? "rgba(224,82,90,.35)" : ok? "rgba(99,252,175,.75)":"rgba(224,176,122,.8)";
    var y=Y(z.ap), x0=X(i)-bw/2;
    g.beginPath(); g.roundRect(x0, Math.min(y,H-padB-2), bw, Math.max(2,(H-padB)-y), 3); g.fill();
    g.fillStyle="#9AA1AB"; g.font="9.5px 'Bai Jamjuree'"; g.textAlign="center";
    g.fillText(mesCorto(z.mes), X(i), H-8);
  });
  if(pactado>0){
    g.strokeStyle="#FEF9F3"; g.setLineDash([5,4]); g.lineWidth=1.2;
    g.beginPath(); g.moveTo(padL,Y(pactado)); g.lineTo(W-padR,Y(pactado)); g.stroke(); g.setLineDash([]);
    g.fillStyle="#FEF9F3"; g.font="700 10.5px 'Bai Jamjuree'"; g.textAlign="right";
    g.fillText("tu aporte pactado: "+fmt(pactado), W-padR-2, Y(pactado)-5);
  }
}

/* ================= carga ================= */
async function entrar(clave){
  var r=await fetch(BASE+"/reporte",{ method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+ANON, "apikey":ANON },
    body:JSON.stringify({ alias:ALIAS, clave:clave }) });
  var j=await r.json();
  if(!r.ok) throw new Error(j.error||("error "+r.status));
  return j;
}
function mostrar(){
  $("login").style.display="none"; $("app").style.display="";
  render();
  window.addEventListener("resize", function(){ if(D) render(); });
}
$("entrar").addEventListener("click", async function(){
  var b=$("entrar"); b.disabled=true; b.textContent="Abriendo…"; $("err").style.display="none";
  try{
    D=await entrar($("clave").value.trim());
    sessionStorage.setItem("r_clave_"+ALIAS, $("clave").value.trim());
    mostrar();

});

/* ================= maqueta (#demo) ================= */
function demoSerieSemanal(escenario){
  // ~110 cierres semanales del "Nasdaq" con un techo y una caída según el escenario
  var n=110, c=[], t=[], v=14500;
  var caidaFinal= escenario==="fuera"? 0.26 : escenario==="cerca"? 0.135 : 0.032;
  var semCaida= escenario==="normal"? 6 : 16;
  for(var i=0;i<n;i++){
    var drift= i<n-semCaida? 0.0035 : -(caidaFinal/semCaida)*1.9;
    var ruido=Math.sin(i*1.7)*0.006+Math.sin(i*0.41)*0.004;
    v*=1+drift+ruido;
    c.push(Math.round(v));
    var d=new Date(Date.now()-(n-1-i)*7*864e5);
    t.push(d.toISOString().slice(0,10));
  }
  // ajusta el final exacto a la distancia deseada vs máx 39
  var mx=0; for(var j=Math.max(0,n-40);j<n;j++) if(c[j]>mx) mx=c[j];
  c[n-1]=Math.round(mx*(1-caidaFinal));
  return {t:t, c:c};
}
function demoDatos(escenario){
  var fuera=escenario==="fuera";
  var serie=demoSerieSemanal(escenario);
  var n=serie.c.length, mx=0;
  for(var j=Math.max(0,n-40);j<n;j++) if(serie.c[j]>mx) mx=serie.c[j];
  var dist=(serie.c[n-1]/mx-1)*100;
  var hoyISO=new Date().toISOString().slice(0,10);
  var equity= fuera? 852000: 876400, cash= fuera? 36000: 36400;
  var meses=[], eq=560000;
  for(var k=11;k>=0;k--){
    var d=new Date(); d.setUTCMonth(d.getUTCMonth()-k,1);
    var mes=d.toISOString().slice(0,10);
    eq*=1.024;
    var ap= k===0? 0 : (k===4? 0 : (k%5===0? 2000:1500));
    meses.push({ mes:mes,
      equity: k===0? equity : Math.round(eq),
      cash: k===0? cash : 2600,
      aportado_total: 468000+(11-k)*1500,
      phi: (k===0? equity: eq)/1200000,
      posiciones: k===0? [
        { s:"TQQQ", q:640, px:93.7, entrada:61.2, v:59968, pnl:20800, pnlp:53.2, hoy:1.4 },
        { s:"SPY", q:1226, px:571.1, entrada:441.0, v:700168, pnl:159480, pnlp:29.5, hoy:0.4 },
        { s:"SJC", q:800, px:100.1, entrada:100.0, v:80064, pnl:64, pnlp:0.1, hoy:0.0 }
      ]:[],
      transferencias_mes: ap>0? [{fecha:mes, monto:ap}]:[],
      cuenta: k===0? { last_equity:equity-3900, tir:12.9, inicio:"2021-05-10",
        ytd_pnl:64200, ytd_pct: fuera? -2.1: 8.4 }:{}
    });
  }
  return {
    nombre:"María Vargas",
    meta:{ ingreso:4000, tasa:4, aporte_pactado:1500, capital_inicial:0, pico:0.75,
      plan:{ f1:"TQQQ", f2:"SPY", f3:"SJC", p1:70, p2:100, ff:70, timing:true } },
    snapshots: meses,
    senal:{ semana:hoyISO, estado: fuera? "fuera":"dentro", distancia:dist, max39:mx, cierre:serie.c[n-1] },
    serie: serie,
    pico: 0.75
  };
}
