<!DOCTYPE html>
<!-- ============================================================================
PROSPECTOS · SOUTHLAND GROUP (CRM interno de Jose y su socio)
- Página interna: noindex, sin sitemap, sin enlaces desde el sitio.
- Los datos viven en Supabase (tabla sg_prospectos, cifrados en reposo) detrás de la
  Edge Function sg-crm del repo ei-sistema, con clave compartida propia (SG_CLAVE).
- La carta semanal que vivía aquí quedó en el historial de git (commit "sg: carta semanal");
  la edición de muestra con gráficos sigue en /sg/muestra/.
============================================================================= -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospectos · Southland Group</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23124c91'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='bold' fill='%23f2bd0f' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Identidad Southland: Raleway, azul #124c91, dorado #f2bd0f (sin paleta de Empowered). */
  :root{
    --azul:#124c91; --azul-oscuro:#0d3768; --dorado:#f2bd0f;
    --texto:#3a3f47; --texto-suave:#6b7077; --linea:#e3e6ea; --fondo:#f6f8fa; --blanco:#ffffff;
    --ok:#1e7a46; --rojo:#b3261e;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{ background:var(--fondo); color:var(--texto); font-family:'Raleway',Arial,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea,select{ font-family:inherit; font-size:16px; color:var(--texto); }

  /* ===== barra de marca ===== */
  .top{ position:sticky; top:0; z-index:20; background:var(--blanco); border-bottom:1px solid var(--linea);
    padding:10px 14px; display:flex; align-items:center; gap:10px; }
  .top{ position:relative; }
  .toplogo{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); height:44px; width:auto; max-width:46vw; object-fit:contain; }
  .top{ min-height:62px; }
  @media (max-width:560px){ .lbl-act{ display:none; } .icobtn{ padding:7px 12px; } }
  .top .sp{ flex:1; }
  .icobtn{ background:var(--blanco); border:1px solid var(--linea); border-radius:8px; padding:7px 11px;
    font-size:14px; font-weight:600; color:var(--azul); }
  .icobtn:active{ background:var(--fondo); }

  /* ===== login ===== */
  #login{ max-width:380px; margin:9vh auto 0; padding:0 18px; }
  #login .card{ background:var(--blanco); border:1px solid var(--linea); border-radius:14px; padding:26px 22px; }
  .loginlogo{ display:block; margin:2px auto 0; width:min(90%,300px); height:auto; }
  #login h1{ font-size:15px; font-weight:700; text-align:center; margin:16px 0 18px; color:var(--texto); }
  #login label{ display:block; font-size:12px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    color:var(--texto-suave); margin:12px 0 5px; }
  #login input{ width:100%; padding:12px; border:1px solid var(--linea); border-radius:9px; background:var(--blanco); }
  #login button{ width:100%; margin-top:18px; padding:13px; border:0; border-radius:9px; background:var(--azul);
    color:#fff; font-weight:700; font-size:15.5px; letter-spacing:.4px; }
  #login .err{ color:var(--rojo); font-size:13.5px; margin-top:10px; text-align:center; min-height:18px; }

  /* ===== resumen ===== */
  .resumen{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px 14px 4px; max-width:760px; margin:0 auto; }
  .stat{ background:var(--blanco); border:1px solid var(--linea); border-radius:10px; padding:9px 10px; text-align:center; }
  .stat .k{ font-size:10.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--texto-suave); }
  .stat .v{ font-size:18px; font-weight:800; color:var(--azul); font-variant-numeric:tabular-nums; margin-top:1px; }
  .stat .v.dor{ color:#8a6d00; }

  /* ===== filtros y orden ===== */
  .controles{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px 2px; max-width:760px; margin:0 auto; align-items:center; }
  .chip{ border:1px solid var(--linea); background:var(--blanco); border-radius:999px; padding:6px 13px;
    font-size:13px; font-weight:600; color:var(--texto-suave); }
  .chip.on{ background:var(--azul); border-color:var(--azul); color:#fff; }
  .controles .sep{ flex:1; }
  .controles select{ border:1px solid var(--linea); border-radius:8px; padding:6px 8px; background:var(--blanco);
    font-size:13px; font-weight:600; color:var(--texto-suave); }

  /* ===== lista ===== */
  #lista{ max-width:760px; margin:0 auto; padding:10px 14px 110px; display:flex; flex-direction:column; gap:9px; }
  .pcard{ background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:13px 14px; cursor:pointer; }
  .pcard:active{ background:#fbfcfd; }
  .pcard .fila1{ display:flex; align-items:baseline; gap:8px; }
  .pcard .nom{ font-weight:800; font-size:16.5px; color:#22262c; flex:1; min-width:0; }
  .pcard .monto{ font-weight:800; font-size:16px; color:var(--azul); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pcard .monto.nd{ color:var(--texto-suave); font-weight:600; font-size:13px; }
  .pcard .dsc{ font-size:14px; color:var(--texto-suave); margin-top:3px; }
  .pcard .fila2{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:9px; }
  .prio{ font-size:11px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .prio.dias{ background:var(--dorado); color:#3d3000; }
  .prio.semanas{ background:#e4ecf6; color:var(--azul); }
  .prio.explorando{ background:#eef0f2; color:var(--texto-suave); }

  /* ===== vista de tabla ===== */
  .twrap{ background:var(--blanco); border:1px solid var(--linea); border-radius:12px; overflow-x:auto; }
  .ptab{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:700px; }
  .ptab thead th{ background:var(--azul); color:#fff; text-align:left; padding:10px 12px; font-weight:700;
    letter-spacing:.3px; white-space:nowrap; }
  .ptab thead th.m{ text-align:right; }
  .ptab tbody td{ padding:10px 12px; border-bottom:1px solid var(--linea); vertical-align:top; }
  .ptab tbody tr:last-child td{ border-bottom:0; }
  .ptab tbody tr{ cursor:pointer; }
  .ptab tbody tr:hover td, .ptab tbody tr:active td{ background:#fbfcfd; }
  .ptab td.nom{ font-weight:700; color:#22262c; white-space:nowrap; }
  .ptab td.m{ text-align:right; font-weight:800; color:var(--azul); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ptab td.m.nd{ color:var(--texto-suave); font-weight:600; }
  .ptab td.reuc{ font-size:12.5px; color:var(--ok); font-weight:600; white-space:nowrap; }
  .ptab td.quienc{ font-size:12px; color:#9aa0a8; white-space:nowrap; }
  .reu{ font-size:12.5px; font-weight:600; color:var(--ok); }
  .pcard .quien{ font-size:11.5px; color:#9aa0a8; margin-left:auto; }
  .vacio{ text-align:center; color:var(--texto-suave); padding:34px 10px; font-size:14.5px; }

  /* ===== botón nuevo ===== */
  #btn-nuevo{ position:fixed; right:16px; bottom:18px; z-index:15; border:0; border-radius:999px;
    background:var(--azul); color:#fff; font-weight:700; font-size:15.5px; padding:14px 20px;
    box-shadow:0 6px 18px rgba(13,55,104,.35); }

  /* ===== editor (hoja) ===== */
  #velo{ display:none; position:fixed; inset:0; background:rgba(13,55,104,.45); z-index:30; }
  #editor{ display:none; position:fixed; left:0; right:0; bottom:0; top:auto; max-height:92vh; overflow-y:auto;
    z-index:31; background:var(--blanco); border-radius:16px 16px 0 0; padding:18px 18px 26px;
    max-width:640px; margin:0 auto; }
  @media (min-width:700px){ #editor{ top:5vh; bottom:auto; border-radius:16px; } }
  #editor h2{ font-size:16px; font-weight:800; color:var(--azul); letter-spacing:.4px; margin-bottom:12px; }
  #editor label{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase;
    color:var(--texto-suave); margin:13px 0 5px; }
  #editor input, #editor textarea{ width:100%; padding:11px 12px; border:1px solid var(--linea); border-radius:9px; background:var(--blanco); }
  #editor textarea{ min-height:74px; resize:vertical; }
  .segp{ display:flex; gap:6px; }
  .segp button{ flex:1; border:1px solid var(--linea); background:var(--blanco); border-radius:9px; padding:9px 4px;
    font-size:13px; font-weight:700; color:var(--texto-suave); }
  .segp button.on.dias{ background:var(--dorado); border-color:var(--dorado); color:#3d3000; }
  .segp button.on.semanas{ background:var(--azul); border-color:var(--azul); color:#fff; }
  .segp button.on.explorando{ background:#5d646d; border-color:#5d646d; color:#fff; }
  .dosCol{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .montoRow{ display:flex; gap:8px; align-items:stretch; }
  #editor .montoRow input{ width:120px; min-width:0; text-align:right; }
  .segp.unid{ width:112px; flex:none; }
  .segp.unid button.on{ background:var(--azul); border-color:var(--azul); color:#fff; }
  #editor .acciones{ display:flex; gap:9px; margin-top:20px; }
  #editor .acciones button{ border-radius:9px; padding:13px 14px; font-weight:700; font-size:15px; border:0; }
  #btn-guardar{ flex:1; background:var(--azul); color:#fff; }
  #btn-cancelar{ background:var(--fondo); color:var(--texto-suave); border:1px solid var(--linea) !important; }
  #btn-borrar{ background:#fdf2f1; color:var(--rojo); }
  .nota-edit{ font-size:12px; color:var(--texto-suave); margin-top:4px; }

  /* ===== toast ===== */
  #toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:40; background:#22262c; color:#fff;
    font-size:14px; font-weight:600; border-radius:999px; padding:9px 18px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.ver{ opacity:1; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="card">
    <img class="loginlogo" src="logo-southland.png" alt="Southland Corporate Finance">
    <h1>Prospectos · acceso privado</h1>
    <label for="l-clave">Clave compartida</label>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <div class="top">
    <button class="icobtn" id="btn-refrescar" title="Traer lo último" aria-label="Actualizar">↻<span class="lbl-act"> Actualizar</span></button>
    <img class="toplogo" src="logo-southland.png" alt="Southland Corporate Finance">
    <div class="sp"></div>
    <button class="icobtn" id="btn-salir" title="Salir">Salir</button>
  </div>

  <div class="resumen">
    <div class="stat"><div class="k">Prospectos</div><div class="v" id="s-n">—</div></div>

    <div class="stat"><div class="k">🎯 Próx. días</div><div class="v dor" id="s-ahora">—</div></div>
  </div>

  <div class="controles">
    <button class="chip on" data-f="todos">Todos</button>
    <button class="chip" data-f="dias">🎯 Próx. días</button>

<!-- ===== EDITOR ===== -->
<div id="velo"></div>
<div id="editor">
  <h2 id="e-titulo">Nuevo prospecto</h2>
  <label for="e-nombre">Nombre</label>
  <input id="e-nombre" type="text">
  <label for="e-dsc">Descripción</label>
  <textarea id="e-dsc" placeholder="quién es, contexto, tareas… ej: Empresario de Grecia. Preguntarle por su family office."></textarea>
  <label for="e-monto">Potential investment</label>
  <div class="montoRow">
    <input id="e-monto" inputmode="decimal" placeholder="ej. 10 — vacío si no sabés aún">
    <div class="segp unid" id="e-unid">
      <button data-u="mm" class="on">MM</button>
      <button data-u="k">K</button>

  <div class="segp" id="e-prio">
    <button data-p="dias" class="dias">🎯 Próx. días</button>

  <label for="e-cuando">Reunión · cuándo aproximadamente</label>
  <input id="e-cuando" type="text" placeholder="ej. próxima semana / pedirle fecha">
  <div class="dosCol">
    <div><label for="e-fecha">O fecha ya es fija</label><input id="e-fecha" type="date"></div>
    <div><label for="e-hora">Hora</label><input id="e-hora" type="time"></div>

  <input id="e-lugar" type="text" placeholder="ej. oficina, Hotel Real, Zoom">
  <div class="acciones">
    <button id="btn-cancelar">Cancelar</button>
    <button id="btn-borrar" style="display:none">Eliminar</button>
    <button id="btn-guardar">Guardar</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
var API="https://jsjhfiakinodosesdqum.supabase.co/functions/v1/sg-crm";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzamhmaWFraW5vZG9zZXNkcXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjY5NTQsImV4cCI6MjEwMTY0Mjk1NH0.MfXXQ6QFx_OudI5Bj9Sr7yw5PRTv_O45NQ_X24tuqLU";
function byId(id){ return document.getElementById(id); }

var S={ lista:[], filtro:"todos", orden:"prio", editId:null, prio:"explorando", ultimaCarga:0,
  vista: localStorage.getItem("sg_vista")||"tabla" };

/* prioridades: 1 próximos días · 2 próximas semanas · 3 explorando conversaciones
   (los valores viejos ahora/pronto/radar se traducen al leer) */
var PRIO_LBL={ dias:"Próximos días", semanas:"Próximas semanas", explorando:"Explorando conversaciones" };
var PRIO_RANK={ dias:0, semanas:1, explorando:2 };
function prioDe(p){ var v=p&&p.prio;
  if(PRIO_LBL[v]) return v;
  if(v==="ahora") return "dias";
  if(v==="pronto"||v==="radar") return "explorando";
  return "explorando"; }

function clave(){ return localStorage.getItem("sg_clave")||""; }
function quien(){ return localStorage.getItem("sg_quien")||""; }

async function api(body){
  body.clave=clave();
  var r=await fetch(API,{ method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+ANON, "apikey":ANON },
    body:JSON.stringify(body) });
  var j=await r.json().catch(function(){ return {}; });
  if(r.status===401){ salir("La clave ya no sirve. Entrá de nuevo."); throw new Error("clave"); }
  if(!r.ok) throw new Error(j.error||("error "+r.status));
  return j;
}

function toast(t){ var el=byId("toast"); el.textContent=t; el.classList.add("ver");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove("ver"); },2200); }

/* ===== dinero ===== */
function money(n){ if(n==null||!(n>0)) return null;
  if(n>=1e6) return "$"+(Math.round(n/1e5)/10)+"M";
  if(n>=1e3) return "$"+Math.round(n/1e3)+"k";
  return "$"+Math.round(n); }

/* ===== fechas ===== */
var DIAS=["dom","lun","mar","mié","jue","vie","sáb"], MESES=["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
function fmtFecha(f,h){ if(!f) return null;
  var p=f.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  var t=DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()];
  if(h){ var hp=h.split(":"), hh=+hp[0], ap=hh>=12?"pm":"am"; hh=hh%12||12; t+=" · "+hh+":"+hp[1]+" "+ap; }
  return t; }
function hace(iso){ var ms=Date.now()-new Date(iso).getTime(), m=Math.round(ms/60000);
  if(m<2) return "recién"; if(m<60) return "hace "+m+" min"; var h=Math.round(m/60);
  if(h<24) return "hace "+h+" h"; return "hace "+Math.round(h/24)+" d"; }

/* ===== render ===== */
function reuTexto(p){
  if(p.fecha){ var t="📅 "+fmtFecha(p.fecha,p.hora); if(p.lugar) t+=" · "+p.lugar; return t; }
  if(p.cuando){ return "🗓️ "+p.cuando+(p.lugar?(" · "+p.lugar):""); }
  return null; }
function filtrada(){
  var l=S.lista.slice();
  if(S.filtro==="dias") l=l.filter(function(p){ return prioDe(p)==="dias"; });
  if(S.filtro==="reunion") l=l.filter(function(p){ return p.fecha||p.cuando; });
  if(S.orden==="prio") l.sort(function(a,b){ return PRIO_RANK[prioDe(a)]-PRIO_RANK[prioDe(b)] || (b.monto||0)-(a.monto||0); });
  if(S.orden==="monto") l.sort(function(a,b){ return (b.monto||0)-(a.monto||0); });
  if(S.orden==="reciente") l.sort(function(a,b){ return a.actualizado<b.actualizado?1:-1; });
  return l;
}
function renderTarjetas(out,l){
  l.forEach(function(p){
    var card=document.createElement("div"); card.className="pcard";
    var m=money(p.monto), reu=reuTexto(p), pr=prioDe(p);
    card.innerHTML='<div class="fila1"><div class="nom"></div>'
      +'<div class="monto'+(m?"":" nd")+'">'+(m||"por definir")+'</div></div>'
      +(p.dsc?'<div class="dsc"></div>':"")
      +'<div class="fila2"><span class="prio '+pr+'">'+(pr==="dias"?"🎯 ":"")+PRIO_LBL[pr]+'</span>'
      +(reu?'<span class="reu"></span>':"")
      +'<span class="quien">'+(p.por?("editó "+p.por+" · "):"")+hace(p.actualizado)+'</span></div>';
    card.querySelector(".nom").textContent=p.nombre||"(sin nombre)";
    if(p.dsc) card.querySelector(".dsc").textContent=p.dsc;
    if(reu) card.querySelector(".reu").textContent=reu;
    card.addEventListener("click",function(){ abrirEditor(p); });
    out.appendChild(card);
  });
}
function renderTabla(out,l){
  var wrap=document.createElement("div"); wrap.className="twrap";
  var tab=document.createElement("table"); tab.className="ptab";
  tab.innerHTML='<thead><tr><th>Nombre</th><th class="m">Potencial</th><th>Prioridad</th><th>Reunión</th><th>Descripción</th><th>Editó</th></tr></thead>';
  var tb=document.createElement("tbody");
  l.forEach(function(p){
    var tr=document.createElement("tr"), m=money(p.monto), pr=prioDe(p), reu=reuTexto(p);
    function td(cls,txt){ var c=document.createElement("td"); if(cls)c.className=cls; c.textContent=txt||""; tr.appendChild(c); return c; }
    td("nom", p.nombre||"(sin nombre)");
    td("m"+(m?"":" nd"), m||"por definir");
    var cp=document.createElement("td"); cp.innerHTML='<span class="prio '+pr+'">'+(pr==="dias"?"🎯 ":"")+PRIO_LBL[pr]+'</span>'; tr.appendChild(cp);
    td("reuc", reu||"—");
    var d=p.dsc||""; td("", d.length>72 ? d.slice(0,70)+"…" : d);
    td("quienc", (p.por?(p.por+" · "):"")+hace(p.actualizado));
    tr.addEventListener("click",function(){ abrirEditor(p); });
    tb.appendChild(tr);
  });
  tab.appendChild(tb); wrap.appendChild(tab); out.appendChild(wrap);
}
function render(){
  var l=filtrada();
  var tot=0, nDias=0;
  S.lista.forEach(function(p){ tot+=p.monto||0; if(prioDe(p)==="dias") nDias++; });
  byId("s-n").textContent=S.lista.length;
  byId("s-pipe").textContent=money(tot)||"$0";
  byId("s-ahora").textContent=nDias;
  byId("vista").textContent = S.vista==="tabla" ? "▤ Tarjetas" : "☰ Tabla";

  var out=byId("lista"); out.innerHTML="";
  if(!l.length){ out.innerHTML='<div class="vacio">Nada por aquí todavía. Tocá <b>＋ Prospecto</b> para agregar el primero.</div>'; return; }
  if(S.vista==="tabla") renderTabla(out,l); else renderTarjetas(out,l);
}
byId("vista").addEventListener("click",function(){
  S.vista = S.vista==="tabla" ? "tarjetas" : "tabla";
  localStorage.setItem("sg_vista",S.vista); render(); });

/* ===== cargar ===== */
async function cargar(msj){
  try{ var j=await api({accion:"listar"}); S.lista=j.prospectos||[]; S.ultimaCarga=Date.now(); render(); if(msj) toast(msj); }
  catch(e){ if(e.message!=="clave") toast("No se pudo cargar: "+e.message); }
}

/* ===== login ===== */
function entrarOk(){ byId("login").style.display="none"; byId("app").style.display="block"; cargar(); }
function salir(msj){ localStorage.removeItem("sg_clave"); byId("app").style.display="none";
  byId("login").style.display="block"; if(msj) byId("l-err").textContent=msj; }
byId("l-entrar").addEventListener("click", async function(){
  var c=byId("l-clave").value.trim(), q=byId("l-quien").value.trim();
  if(!c||!q){ byId("l-err").textContent="Poné la clave y tu nombre."; return; }
  byId("l-err").textContent=""; this.textContent="Entrando…";
  localStorage.setItem("sg_clave",c); localStorage.setItem("sg_quien",q);
  try{ await api({accion:"listar"}); entrarOk(); }
  catch(e){ byId("l-err").textContent = e.message==="clave" ? "Clave incorrecta." : ("Error: "+e.message); }
  this.textContent="Entrar";
});
byId("l-clave").addEventListener("keydown",function(e){ if(e.key==="Enter") byId("l-quien").focus(); });
byId("l-quien").addEventListener("keydown",function(e){ if(e.key==="Enter") byId("l-entrar").click(); });
byId("btn-salir").addEventListener("click",function(){ salir(); });
byId("btn-refrescar").addEventListener("click",function(){ cargar("Actualizado ✓"); });
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && clave() && Date.now()-S.ultimaCarga>30000) cargar(); });

/* ===== filtros y orden ===== */
Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(ch){
  ch.addEventListener("click",function(){
    Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(x){ x.classList.remove("on"); });
    ch.classList.add("on"); S.filtro=ch.getAttribute("data-f"); render(); }); });
byId("orden").addEventListener("change",function(){ S.orden=this.value; render(); });

/* ===== editor ===== */
function setPrio(p){ S.prio=p;
  Array.prototype.forEach.call(byId("e-prio").children,function(b){
    b.classList.toggle("on", b.getAttribute("data-p")===p); }); }
Array.prototype.forEach.call(byId("e-prio").children,function(b){
  b.addEventListener("click",function(){ setPrio(b.getAttribute("data-p")); }); });
/* monto: se escribe en millones (MM) por default — "10" = $10,000,000 — con opción K para miles */
function unidad(){ return byId("e-unid").querySelector("button.on").getAttribute("data-u"); }
function montoDeCampo(){ var v=parseFloat(byId("e-monto").value.replace(/[^0-9.]/g,""));
  if(isNaN(v)||v<=0) return null; return Math.round(v*(unidad()==="mm"?1e6:1e3)); }
function eqMonto(){ var m=montoDeCampo();
  byId("e-monto-eq").textContent = m ? ("= $"+m.toLocaleString("en-US")) : ""; }
byId("e-monto").addEventListener("input",function(){
  var d=this.value.replace(/[^0-9.]/g,""); var i=d.indexOf(".");
  if(i>=0) d=d.slice(0,i+1)+d.slice(i+1).replace(/\./g,"");
  this.value=d; eqMonto(); });
Array.prototype.forEach.call(byId("e-unid").children,function(b){
  b.addEventListener("click",function(){
    var antes=unidad(), m=parseFloat(byId("e-monto").value); var nueva=b.getAttribute("data-u");
    if(antes===nueva) return;
    Array.prototype.forEach.call(byId("e-unid").children,function(x){ x.classList.toggle("on",x===b); });
    if(!isNaN(m)&&m>0){ var v=nueva==="mm"?m/1000:m*1000;
      byId("e-monto").value=String(Math.round(v*1000)/1000); }
    eqMonto(); }); });
function setUnidad(u){ Array.prototype.forEach.call(byId("e-unid").children,function(x){
  x.classList.toggle("on", x.getAttribute("data-u")===u); }); }

function abrirEditor(p){
  S.editId=p?p.id:null;
  byId("e-titulo").textContent=p?"Editar prospecto":"Nuevo prospecto";
  byId("e-nombre").value=p?(p.nombre||""):"";
  byId("e-dsc").value=p?(p.dsc||""):"";
  if(p&&p.monto){ if(p.monto>=1e6){ setUnidad("mm"); byId("e-monto").value=String(Math.round(p.monto/1e6*1000)/1000); }
    else { setUnidad("k"); byId("e-monto").value=String(Math.round(p.monto/1e3*10)/10); } }
  else { setUnidad("mm"); byId("e-monto").value=""; }
  eqMonto();
  byId("e-cuando").value=p?(p.cuando||""):"";
  byId("e-fecha").value=p?(p.fecha||""):"";
  byId("e-hora").value=p?(p.hora||""):"";
  byId("e-lugar").value=p?(p.lugar||""):"";
  setPrio(p?prioDe(p):"explorando");
  var bb=byId("btn-borrar"); bb.style.display=p?"block":"none"; bb.textContent="Eliminar"; bb._arm=false;
  byId("velo").style.display="block"; byId("editor").style.display="block";
  if(!p) setTimeout(function(){ byId("e-nombre").focus(); },50);
}
function cerrarEditor(){ byId("velo").style.display="none"; byId("editor").style.display="none"; }
byId("velo").addEventListener("click",cerrarEditor);
byId("btn-cancelar").addEventListener("click",cerrarEditor);
byId("btn-nuevo").addEventListener("click",function(){ abrirEditor(null); });

byId("btn-guardar").addEventListener("click", async function(){
  var nombre=byId("e-nombre").value.trim();
  if(!nombre){ toast("Falta el nombre."); return; }
  var p={ id:S.editId||undefined, nombre:nombre, dsc:byId("e-dsc").value.trim(),
    monto:montoDeCampo(), prio:S.prio,
    cuando:byId("e-cuando").value.trim(), fecha:byId("e-fecha").value, hora:byId("e-hora").value,
    lugar:byId("e-lugar").value.trim(), por:quien() };
  this.textContent="Guardando…"; this.disabled=true;
  try{ var j=await api({accion:"guardar", prospecto:p}); S.lista=j.prospectos||[]; S.ultimaCarga=Date.now();
    render(); cerrarEditor(); toast("Guardado ✓"); }
  catch(e){ if(e.message!=="clave") toast("No se guardó: "+e.message); }
  this.textContent="Guardar"; this.disabled=false;
});
byId("btn-borrar").addEventListener("click", async function(){
  if(!this._arm){ this._arm=true; this.textContent="¿Seguro? Tocá de nuevo"; return; }
  this.textContent="Eliminando…"; this.disabled=true;
  try{ var j=await api({accion:"borrar", id:S.editId}); S.lista=j.prospectos||[]; S.ultimaCarga=Date.now();
    render(); cerrarEditor(); toast("Eliminado"); }
  catch(e){ if(e.message!=="clave") toast("No se borró: "+e.message); }
  this.textContent="Eliminar"; this.disabled=false; this._arm=false;
});

/* arranque */
if(clave()&&quien()) entrarOk();
</script>
</body>
</html>
