<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Empowered Investor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo-fondo-negro.png">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --tinta:#0d0f14; --card:#161a22; --card2:#1c212b; --bd:#2a3140; --input:#10141b;
    --crema:#FEF9F3; --gris:#E2E2E2; --gris-sec:#9AA1AB; --menta:#63FCAF; --peri:#556DFB; --ambar:#E0B07A; --rojo:#E0525A; }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{ background:var(--tinta); color:var(--gris); font-family:'Bai Jamjuree',system-ui,sans-serif; line-height:1.5; }
  .wrap{ max-width:760px; margin:0 auto; padding:16px 14px 60px; }
  h1{ font-size:20px; color:var(--crema); margin:8px 0 2px; }
  .note{ font-size:13px; color:var(--gris-sec); }
  /* login */
  .caja{ max-width:360px; margin:14vh auto 0; background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:26px 22px; text-align:center; }
  .caja img{ height:72px; margin-bottom:8px; }
  .caja input{ width:100%; background:var(--input); border:1px solid var(--bd); border-radius:10px; color:var(--crema);
    font-family:inherit; font-size:16px; padding:12px 12px; text-align:center; margin-top:12px; }
  .caja input:focus{ outline:none; border-color:var(--menta); }
  .caja button{ width:100%; margin-top:12px; background:var(--menta); color:#082018; border:none; border-radius:10px;
    font-family:inherit; font-size:15px; font-weight:800; padding:12px; cursor:pointer; }
  .err{ color:var(--rojo); font-size:13px; margin-top:10px; display:none; }
  /* señal */
  .senal{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--bd); border-radius:14px;
    padding:12px 14px; margin:12px 0; }
  .senal.dentro{ border-color:rgba(99,252,175,.45); } .senal.fuera{ border-color:rgba(224,82,90,.55); background:#1c1215; }
  .senal .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 auto; }
  .senal.dentro .dot{ background:var(--menta); box-shadow:0 0 12px rgba(99,252,175,.7); }
  .senal.fuera .dot{ background:var(--rojo); box-shadow:0 0 12px rgba(224,82,90,.7); }
  .senal b{ color:var(--crema); }
  .tots{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .tot{ background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:10px 12px; }
  .tot .k{ font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--gris-sec); }
  .tot .v{ font-size:18px; font-weight:800; color:var(--crema); }
  /* cliente */
  .cli{ background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:14px 15px; margin-bottom:12px; }
  .cli .top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .cli h3{ margin:0; font-size:16.5px; color:var(--crema); }
  .cli .alias{ font-size:11px; color:var(--gris-sec); }
  .barra{ height:10px; background:var(--input); border:1px solid var(--bd); border-radius:999px; margin:10px 0 4px; overflow:hidden; }
  .barra i{ display:block; height:100%; background:linear-gradient(90deg,#2f7d5a,var(--menta)); border-radius:999px; }
  .fila{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-bottom:1px solid rgba(42,49,64,.5); }
  .fila b{ color:var(--crema); } .fila:last-of-type{ border-bottom:none; }
  .chip{ display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; margin-left:6px; }
  .chip.f1{ background:rgba(224,82,90,.16); color:#ff9ea4; } .chip.f2{ background:rgba(85,109,251,.18); color:#aab7ff; }
  .chip.f3{ background:rgba(99,252,175,.15); color:var(--menta); }
  .accion{ margin-top:9px; background:rgba(99,252,175,.08); border:1px solid rgba(99,252,175,.35); border-radius:10px;
    padding:8px 11px; font-size:12.5px; color:var(--crema); }
  .accion.calma{ background:rgba(154,161,171,.07); border-color:var(--bd); color:var(--gris-sec); }
  .notas{ margin-top:8px; font-size:12px; color:var(--ambar); }
  .toolbar{ display:flex; gap:8px; margin:4px 0 14px; flex-wrap:wrap; }
  .toolbar button{ background:var(--card2); border:1px solid var(--bd); color:var(--crema); border-radius:999px;
    padding:9px 15px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .toolbar button:hover{ border-color:var(--menta); }
  #estado{ font-size:12.5px; color:var(--gris-sec); margin-bottom:10px; }
</style>
</head>
<body>
<div id="login" class="caja">
  <img src="/assets/logo-fondo-negro.png" alt="EI">
  <div style="font-weight:800;color:var(--crema)">Panel de cuentas</div>
  <input id="tok" type="password" placeholder="Admin token" autocomplete="off">
  <button id="entrar">Entrar</button>
  <div class="err" id="err">Token incorrecto.</div>
</div>

<div class="wrap" id="app" style="display:none">
  <h1>Panel de cuentas</h1>
  <div id="senal" class="senal"><div class="dot"></div><div>Cargando señal…</div></div>
  <div class="tots" id="tots"></div>
  <div class="toolbar">
    <button id="refrescar">🔄 Actualizar datos de Alpaca (sin correos)</button>
    <button id="salir">Salir</button>
  </div>
  <div id="estado"></div>
  <div id="lista"></div>
</div>

<script>
"use strict";
var BASE="https://jsjhfiakinodosesdqum.supabase.co/functions/v1";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzamhmaWFraW5vZG9zZXNkcXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjY5NTQsImV4cCI6MjEwMTY0Mjk1NH0.MfXXQ6QFx_OudI5Bj9Sr7yw5PRTv_O45NQ_X24tuqLU";
function $(id){ return document.getElementById(id); }
function money(n){ n=Math.round(n); if(Math.abs(n)>=1e6) return "$"+(n/1e6).toFixed(2)+"M"; if(Math.abs(n)>=1e3) return "$"+Math.round(n/1e3).toLocaleString("en-US")+"k"; return "$"+n.toLocaleString("en-US"); }
function fmt(n){ return "$"+Math.round(n).toLocaleString("en-US"); }

async function llamar(fn, body){
  var r=await fetch(BASE+"/"+fn,{ method:"POST",
    headers:{ "Content-Type":"application/json", "x-admin-token":sessionStorage.getItem("panel_tok")||"",
      "Authorization":"Bearer "+ANON, "apikey":ANON },
    body:JSON.stringify(body||{}) });
  var j=await r.json();
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}

// fase actual segun el avance y el plan del cliente
function faseDe(phi, plan){
  var p1=(plan&&plan.p1||70)/100, p2=(plan&&plan.p2||100)/100;
  if(phi<p1) return {n:1, t:"Fase 1 · "+(plan&&plan.f1||"TQQQ"), c:"f1"};
  if(phi<p2) return {n:2, t:"Fase 2 · migrando a "+(plan&&plan.f3||"SJC"), c:"f2"};
  return {n:3, t:"Llegada · piso asegurado", c:"f3"};
}
function accionDe(c, senal){
  if(!c.snap) return {t:"Sin datos todavía: dale a Actualizar datos.", calma:true};
  var plan=c.meta&&c.meta.plan, acc=[];
  if(senal && senal.estado==="fuera" && plan && plan.timing) acc.push("🔴 Señal FUERA: la parte de mercado va a efectivo.");
  if(c.snap.cash>1000){
    var f=faseDe(c.snap.phi, plan);
    var destino=f.n===1?(plan&&plan.f1||"fase 1"):f.n===2?(plan&&plan.f2||"fase 2"):"el piso ("+(plan&&plan.f3||"SJC")+")";
    acc.push("Hay "+fmt(c.snap.cash)+" en efectivo: invertir en "+destino+".");
  }
  var pact=c.meta&&c.meta.aporte_pactado||0;
  var delMes=(c.snap.transferencias_mes||[]).reduce(function(s,t){return s+(t.monto||0);},0);
  if(pact>0 && delMes<pact*0.9) acc.push("Aporte del mes: "+fmt(delMes)+" de "+fmt(pact)+" pactados.");
  if(!acc.length) return {t:"Todo en orden: sin acciones pendientes.", calma:true};
  return {t:acc.join(" "), calma:false};
}

function render(d){
  var s=d.senal;
  var sd=$("senal");
  if(s){ sd.className="senal "+(s.estado==="dentro"?"dentro":"fuera");
    sd.innerHTML='<div class="dot"></div><div><b>Señal: '+(s.estado==="dentro"?"DENTRO":"FUERA")+'</b> del mercado · semana del '+s.semana+' · distancia al máximo de 39 sem: '+(+s.distancia).toFixed(1)+'%</div>'; }
  else sd.innerHTML='<div class="dot"></div><div>Sin señal todavía (corre los viernes).</div>';

  var act=d.clientes.filter(function(c){return c.activo;});
  var eq=0, cash=0; act.forEach(function(c){ if(c.snap){ eq+=+c.snap.equity; cash+=+c.snap.cash; } });
  $("tots").innerHTML=
    '<div class="tot"><div class="k">Clientes</div><div class="v">'+act.length+'</div></div>'+
    '<div class="tot"><div class="k">Capital total</div><div class="v">'+money(eq)+'</div></div>'+
    '<div class="tot"><div class="k">Efectivo total</div><div class="v">'+money(cash)+'</div></div>';

  $("lista").innerHTML=act.map(function(c){
    var m=c.meta||{}, fp=m.fp || (m.ingreso? m.ingreso*12/((m.tasa||4)/100):0);
    var phi=c.snap? +c.snap.phi : 0, f=faseDe(phi, m.plan), a=accionDe(c, s);
    var delMes=c.snap?(c.snap.transferencias_mes||[]).reduce(function(x,t){return x+(t.monto||0);},0):0;
    return '<div class="cli">'
      +'<div class="top"><h3>'+c.nombre+'<span class="chip '+f.c+'">'+f.t+'</span></h3><span class="alias">'+c.alias+'</span></div>'
      +'<div class="barra"><i style="width:'+Math.min(100,phi*100).toFixed(1)+'%"></i></div>'
      +'<div class="fila"><span>Avance al freedom point ('+money(fp)+')</span><b>'+(phi*100).toFixed(1)+'%</b></div>'
      +(c.snap
        ? '<div class="fila"><span>Capital · Efectivo</span><b>'+fmt(c.snap.equity)+' · '+fmt(c.snap.cash)+'</b></div>'
         +'<div class="fila"><span>Aportado histórico · este mes</span><b>'+fmt(c.snap.aportado_total)+' · '+fmt(delMes)+(m.aporte_pactado?' de '+fmt(m.aporte_pactado):'')+'</b></div>'
         +'<div class="fila"><span>Dato al</span><b>'+c.snap.mes+'</b></div>'
        : '<div class="fila"><span>Datos</span><b>sin snapshot aún</b></div>')
      +'<div class="accion'+(a.calma?' calma':'')+'">'+a.t+'</div>'
      +(c.notas?'<div class="notas">📝 '+c.notas+'</div>':'')
      +'</div>';
  }).join("") || '<p class="note">No hay clientes todavía: cargalos con alta.html.</p>';
}

async function cargar(){
  try{
    var d = location.hash==="#demo" ? demo() : await llamar("panel");
    $("login").style.display="none"; $("app").style.display="";
    render(d);
  }catch(e){
    sessionStorage.removeItem("panel_tok");
    $("login").style.display=""; $("app").style.display="none";
    $("err").style.display="block"; $("err").textContent=String(e.message||e);
  }
}
$("entrar").addEventListener("click", function(){ sessionStorage.setItem("panel_tok", $("tok").value.trim()); $("tok").value=""; cargar(); });
$("tok").addEventListener("keydown", function(e){ if(e.key==="Enter") $("entrar").click(); });
$("salir").addEventListener("click", function(){ sessionStorage.removeItem("panel_tok"); location.reload(); });
$("refrescar").addEventListener("click", async function(){
  $("estado").textContent="Consultando Alpaca (esto no manda correos)…";
  try{ var r=await llamar("cierre-mes",{sin_correo:true});
    $("estado").textContent="Actualizado ("+r.mes+"): "+JSON.stringify(r.resultados);
    cargar();
  }catch(e){ $("estado").textContent="Error: "+(e.message||e); }
});
if(sessionStorage.getItem("panel_tok") || location.hash==="#demo") cargar();

// datos de utilería para revisar el diseño sin tocar el backend (#demo)
function demo(){
  return { senal:{estado:"dentro",semana:"2026-08-06",distancia:-3.4},
    clientes:[
      {alias:"mv-07",activo:true,nombre:"María Vargas",notas:"Quiere subir aporte en enero.",
        meta:{ingreso:10000,tasa:4,aporte_pactado:1000,plan:{f1:"TQQQ",f2:"SPY",f3:"SJC",p1:70,p2:100,ff:70,timing:true}},
        snap:{mes:"2026-08-01",equity:187000,cash:4200,aportado_total:96000,phi:0.062,transferencias_mes:[{monto:1000}]}},
      {alias:"jr-02",activo:true,nombre:"Javier Rojas",notas:"",
        meta:{ingreso:5000,tasa:4,aporte_pactado:800,plan:{f1:"QLD",f2:"SPY",f3:"SJC",p1:70,p2:100,ff:70,timing:false}},
        snap:{mes:"2026-08-01",equity:1120000,cash:150,aportado_total:410000,phi:0.746,transferencias_mes:[]}}
    ]};
}
</script>
</body>
</html>
