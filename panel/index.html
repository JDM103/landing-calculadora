<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Empowered Investor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo-fondo-negro.png">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --tinta:#0d0f14; --card:#161a22; --card2:#1c212b; --bd:#2a3140; --input:#10141b;
    --crema:#FEF9F3; --gris:#E2E2E2; --gris-sec:#9AA1AB; --menta:#63FCAF; --peri:#556DFB; --ambar:#E0B07A; --rojo:#E0525A; }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{ background:var(--tinta); color:var(--gris); font-family:'Bai Jamjuree',system-ui,sans-serif; line-height:1.45; }
  .wrap{ max-width:1280px; margin:0 auto; padding:14px 14px 40px; }
  h1{ font-size:19px; color:var(--crema); margin:4px 0 8px; }
  .num{ font-variant-numeric:tabular-nums; }
  .caja{ max-width:360px; margin:14vh auto 0; background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:26px 22px; text-align:center; }
  .caja img{ height:72px; margin-bottom:8px; }
  .caja input{ width:100%; background:var(--input); border:1px solid var(--bd); border-radius:10px; color:var(--crema);
    font-family:inherit; font-size:16px; padding:12px; text-align:center; margin-top:12px; }
  .caja input:focus{ outline:none; border-color:var(--menta); }
  .caja button{ width:100%; margin-top:12px; background:var(--menta); color:#082018; border:none; border-radius:10px;
    font-family:inherit; font-size:15px; font-weight:800; padding:12px; cursor:pointer; }
  .err{ color:var(--rojo); font-size:13px; margin-top:10px; display:none; }
  .senal{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--bd); border-radius:12px;
    padding:9px 13px; margin:8px 0; font-size:13.5px; }
  .senal.dentro{ border-color:rgba(99,252,175,.45); } .senal.fuera{ border-color:rgba(224,82,90,.55); background:#1c1215; }
  .senal .pto{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .senal.dentro .pto{ background:var(--menta); box-shadow:0 0 10px rgba(99,252,175,.7); }
  .senal.fuera .pto{ background:var(--rojo); box-shadow:0 0 10px rgba(224,82,90,.7); }
  .senal b{ color:var(--crema); }
  .toolbar{ display:flex; gap:8px; margin:8px 0 12px; flex-wrap:wrap; align-items:center; }
  .toolbar button{ background:var(--card2); border:1px solid var(--bd); color:var(--crema); border-radius:999px;
    padding:8px 14px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .toolbar button:hover{ border-color:var(--menta); }
  .toolbar .tot{ font-size:12.5px; color:var(--gris-sec); margin-left:auto; }
  .toolbar .tot b{ color:var(--crema); }
  #estado{ font-size:12px; color:var(--gris-sec); margin:0 0 8px; }
  .layout{ display:grid; grid-template-columns:minmax(440px,560px) 1fr; gap:14px; align-items:start; }
  .lista{ background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow:hidden; }
  .cab, .fila{ display:grid; grid-template-columns:1.25fr .8fr .55fr .55fr .6fr .72fr .62fr; gap:5px; padding:8px 11px; align-items:center; }
  .cab{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--gris-sec); font-weight:800;
    border-bottom:1px solid var(--bd); background:var(--card2); }
  .cab span{ cursor:pointer; user-select:none; }
  .cab span:hover{ color:var(--crema); }
  .cab span.on{ color:var(--menta); }
  @media(max-width:560px){
    .cab, .fila{ grid-template-columns:1.35fr .85fr .6fr .6fr .7fr; }
    .cab span:nth-child(5), .fila > span:nth-child(5),
    .cab span:nth-child(6), .fila > span:nth-child(6){ display:none; }
  }
  .cab span:not(:first-child), .fila > span:not(:first-child){ text-align:right; }
  .fila{ border-bottom:1px solid rgba(42,49,64,.5); cursor:pointer; font-size:12.5px; }
  .fila:hover{ background:rgba(99,252,175,.05); }
  .fila.sel{ background:rgba(99,252,175,.10); border-left:3px solid var(--menta); padding-left:8px; }
  .fila .nom{ color:var(--crema); font-weight:700; line-height:1.15; }
  .fila .ali{ font-size:10px; color:var(--gris-sec); font-weight:400; }
  .up{ color:var(--menta); } .down{ color:var(--rojo); }
  .det{ background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px 16px; position:sticky; top:10px; }
  .det .vacio{ color:var(--gris-sec); font-size:13.5px; text-align:center; padding:60px 0; }
  .det h2{ margin:0; font-size:19px; color:var(--crema); }
  .det .sub{ font-size:12px; color:var(--gris-sec); margin-bottom:8px; }
  .chip{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 9px; margin-left:8px; vertical-align:middle; }
  .chip.f1{ background:rgba(224,82,90,.16); color:#ff9ea4; } .chip.f2{ background:rgba(85,109,251,.18); color:#aab7ff; }
  .chip.f3{ background:rgba(99,252,175,.15); color:var(--menta); }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:8px; margin:10px 0; }
  .tile{ background:var(--card2); border:1px solid var(--bd); border-radius:11px; padding:9px 11px; }
  .tile .k{ font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--gris-sec); font-weight:800; }
  .tile .v{ font-size:16px; font-weight:800; color:var(--crema); margin-top:1px; }
  .tile .s{ font-size:11px; font-weight:600; }
  .barra{ height:9px; background:var(--input); border:1px solid var(--bd); border-radius:999px; margin:8px 0 3px; overflow:hidden; }
  .barra i{ display:block; height:100%; background:linear-gradient(90deg,#2f7d5a,var(--menta)); border-radius:999px; }
  .sec{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--gris-sec); font-weight:800; margin:14px 0 6px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hbtns{ display:inline-flex; background:var(--input); border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
  .hbtns button{ background:transparent; border:none; color:var(--gris-sec); font-family:inherit; font-size:11px; font-weight:800;
    padding:4px 10px; cursor:pointer; }
  .hbtns button.on{ background:var(--menta); color:#082018; }
  .grafico{ position:relative; height:190px; background:var(--input); border:1px solid var(--bd); border-radius:11px; }
  .grafico canvas{ display:block; width:100%; height:100%; }
  .grafico .msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--gris-sec); font-size:12px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--gris-sec); font-weight:800;
    text-align:right; padding:5px 8px; border-bottom:1px solid var(--bd); }
  td{ padding:6px 8px; text-align:right; border-bottom:1px solid rgba(42,49,64,.45); }
  th:first-child, td:first-child{ text-align:left; }
  td:first-child{ color:var(--crema); font-weight:800; }
  tr:last-child td{ border-bottom:none; }
  .accion{ margin-top:10px; background:rgba(99,252,175,.08); border:1px solid rgba(99,252,175,.35); border-radius:10px;
    padding:8px 11px; font-size:12.5px; color:var(--crema); }
  .accion.calma{ background:rgba(154,161,171,.07); border-color:var(--bd); color:var(--gris-sec); }
  .notas{ margin-top:8px; font-size:12px; color:var(--ambar); }
  .editcap{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--gris-sec); flex-wrap:wrap; }
  .editcap input{ width:110px; background:var(--input); border:1px solid var(--bd); border-radius:8px; color:var(--crema);
    font-family:inherit; font-size:13px; font-weight:700; padding:5px 8px; text-align:right; }
  .editcap input:focus{ outline:none; border-color:var(--menta); }
  .editcap button{ background:var(--card2); border:1px solid var(--bd); color:var(--crema); border-radius:8px;
    padding:5px 12px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .editcap button:hover{ border-color:var(--menta); }
  .volver{ display:none; }
  @media(max-width:900px){
    .layout{ grid-template-columns:1fr; }
    .det{ position:fixed; inset:0; z-index:20; border-radius:0; overflow-y:auto; display:none; }
    .det.abierto{ display:block; }
    .volver{ display:inline-block; background:var(--card2); border:1px solid var(--bd); color:var(--crema);
      border-radius:999px; padding:7px 14px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:10px; }
  }
</style>
</head>
<body>
<div id="login" class="caja">
  <img src="/assets/logo-fondo-negro.png" alt="EI">
  <div style="font-weight:800;color:var(--crema)">Panel de cuentas</div>
  <input id="tok" type="password" placeholder="Admin token" autocomplete="off">
  <button id="entrar">Entrar</button>
  <div class="err" id="err">Token incorrecto.</div>
</div>

<div class="wrap" id="app" style="display:none">
  <h1>Panel de cuentas</h1>
  <div id="senal" class="senal"><div class="pto"></div><div>Cargando señal…</div></div>
  <div class="toolbar">
    <button id="refrescar">🔄 Actualizar datos (sin correos)</button>
    <button id="priv" title="Modo privacidad: esconde los nombres para pantallazos">👁 Privacidad</button>
    <button id="salir">Salir</button>
    <span class="tot" id="tots"></span>
  </div>
  <div id="estado"></div>
  <div class="layout">
    <div class="lista">
      <div class="cab" id="cab">
        <span data-k="nombre">Cliente</span><span data-k="equity">Capital</span><span data-k="dia">Día</span>
        <span data-k="ytd">YTD</span><span data-k="total">Total</span><span data-k="inicio">Desde</span><span data-k="cash">Cash</span>
      </div>
      <div id="filas"></div>
    </div>
    <div class="det" id="det"><div class="vacio">Tocá un cliente para ver su cuenta</div></div>
  </div>
</div>

<script>
"use strict";
var BASE="https://jsjhfiakinodosesdqum.supabase.co/functions/v1";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzamhmaWFraW5vZG9zZXNkcXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjY5NTQsImV4cCI6MjEwMTY0Mjk1NH0.MfXXQ6QFx_OudI5Bj9Sr7yw5PRTv_O45NQ_X24tuqLU";
var DATOS=null, SELECC=null, HORIZONTE="1A", MODOG="cap", CACHE_HIST={}, CACHE_ORD={};
var SORT={k:"nombre", d:1};
var PRIV=sessionStorage.getItem("panel_priv")==="1";
function nomDe(c){ return PRIV ? "••••••••" : c.nombre; }
document.addEventListener("click", function(e){
  var s=e.target.closest("#cab span"); if(!s||!DATOS) return;
  var k=s.getAttribute("data-k");
  if(SORT.k===k) SORT.d=-SORT.d; else { SORT.k=k; SORT.d=(k==="nombre"||k==="inicio")?1:-1; }
  renderLista();
});
function $(id){ return document.getElementById(id); }
function money(n){ n=Math.round(n); var s=n<0?"-":""; n=Math.abs(n);
  if(n>=1e6) return s+"$"+(n/1e6).toFixed(2)+"M"; if(n>=1e4) return s+"$"+Math.round(n/1e3).toLocaleString("en-US")+"k";
  return s+"$"+n.toLocaleString("en-US"); }
function fmt(n){ var s=n<0?"−":""; return s+"$"+Math.abs(Math.round(n)).toLocaleString("en-US"); }
function pct(n){ return (n>=0?"+":"−")+Math.abs(n).toFixed(2)+"%"; }
function cls(n){ return n>=0?"up":"down"; }

async function llamar(fn, body){
  var r=await fetch(BASE+"/"+fn,{ method:"POST",
    headers:{ "Content-Type":"application/json", "x-admin-token":sessionStorage.getItem("panel_tok")||"",
      "Authorization":"Bearer "+ANON, "apikey":ANON },
    body:JSON.stringify(body||{}) });
  var j=await r.json();
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}
function faseDe(phi, plan){
  var p1=(plan&&plan.p1||70)/100, p2=(plan&&plan.p2||100)/100;
  if(phi<p1) return {t:"Fase 1 · "+(plan&&plan.f1||"—"), c:"f1"};
  if(phi<p2) return {t:"Fase 2 · migrando", c:"f2"};
  return {t:"Llegada", c:"f3"};
}
function capIniDe(c){ return (c.meta && +c.meta.capital_inicial) || 0; }
function aportadoDe(c){ if(!c.snap) return 0;
  var fo=c.snap.cuenta && c.snap.cuenta.fondeos;
  var base = (fo && fo.length && typeof fo[0].c!=="undefined")
    ? fo.reduce(function(s,x){ return s + (x.c ? x.m : 0); }, 0)
    : c.snap.aportado_total;
  return base + capIniDe(c); }
function escapa(t){ return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function diaDe(c){ if(!c.snap||!c.snap.cuenta||!c.snap.cuenta.last_equity) return null;
  var d=c.snap.equity-c.snap.cuenta.last_equity;
  return {usd:d, pct:c.snap.cuenta.last_equity>0? d/c.snap.cuenta.last_equity*100:0}; }
function accionDe(c, senal){
  if(!c.snap) return {t:"Sin datos todavía.", calma:true};
  var plan=c.meta&&c.meta.plan, acc=[];
  if(senal && senal.estado==="fuera" && plan && plan.timing) acc.push("🔴 Señal FUERA: la parte de mercado va a efectivo.");
  if(c.snap.cash>1000) acc.push("Hay "+fmt(c.snap.cash)+" en efectivo para invertir según su fase.");
  var pact=c.meta&&c.meta.aporte_pactado||0;
  var delMes=(c.snap.transferencias_mes||[]).reduce(function(s,t){return s+(t.monto||0);},0);
  if(pact>0 && delMes<pact*0.9) acc.push("Aporte del mes: "+fmt(delMes)+" de "+fmt(pact)+" pactados.");
  if(!acc.length) return {t:"Sin acciones pendientes.", calma:true};
  return {t:acc.join(" "), calma:false};
}

function renderLista(){
  var d=DATOS, act=d.clientes.filter(function(c){return c.activo;});
  var s=d.senal, sd=$("senal");
  if(s){ sd.className="senal "+(s.estado==="dentro"?"dentro":"fuera");
    sd.innerHTML='<div class="pto"></div><div><b>Señal: '+(s.estado==="dentro"?"DENTRO":"FUERA")+'</b> · semana del '+s.semana+' · distancia al máx. 39 sem: '+(+s.distancia).toFixed(1)+'%</div>'; }
  var eq=0, cash=0; act.forEach(function(c){ if(c.snap){ eq+=+c.snap.equity; cash+=+c.snap.cash; } });
  $("tots").innerHTML='<b>'+act.length+'</b> clientes · capital <b class="num">'+money(eq)+'</b> · efectivo <b class="num">'+money(cash)+'</b>';
  // valores por fila (el Total ya incluye el capital inicial manual)
  var filas=act.map(function(c){
    var dia=diaDe(c), cta=(c.snap&&c.snap.cuenta)||{}, ap=aportadoDe(c);
    return { c:c, nombre:nomDe(c).toLowerCase(),
      equity:c.snap?+c.snap.equity:null, cash:c.snap?+c.snap.cash:null,
      dia:dia?dia.pct:null, ytd:(typeof cta.ytd_pct==="number")?cta.ytd_pct:null,
      total:(c.snap&&ap>0)?(c.snap.equity-ap)/ap*100:null,
      inicio:cta.inicio||null };
  });
  filas.sort(function(a,b){
    var x=a[SORT.k], y=b[SORT.k];
    if(x===null&&y===null) return 0; if(x===null) return 1; if(y===null) return -1;
    if(x<y) return -SORT.d; if(x>y) return SORT.d; return 0;
  });
  Array.prototype.forEach.call(document.querySelectorAll("#cab span"), function(s){
    var on=s.getAttribute("data-k")===SORT.k;
    s.classList.toggle("on",on);
    s.textContent=s.textContent.replace(/ [▲▼]$/,"")+(on?(SORT.d>0?" ▲":" ▼"):"");
  });
  $("filas").innerHTML=filas.map(function(r){
    var c=r.c;
    return '<div class="fila'+(SELECC===c.alias?' sel':'')+'" data-a="'+c.alias+'">'
      +'<span><div class="nom">'+nomDe(c)+'</div><div class="ali">'+(PRIV?"":c.alias)+'</div></span>'
      +'<span class="num">'+(r.equity!==null?money(r.equity):"—")+'</span>'
      +'<span class="num '+(r.dia!==null?cls(r.dia):"")+'">'+(r.dia!==null?pct(r.dia):"—")+'</span>'
      +'<span class="num '+(r.ytd!==null?cls(r.ytd):"")+'">'+(r.ytd!==null?pct(r.ytd):"—")+'</span>'
      +'<span class="num '+(r.total!==null?cls(r.total):"")+'">'+(r.total!==null?pct(r.total):"—")+'</span>'
      +'<span class="num" style="font-size:11px">'+(r.inicio?(PRIV?'•••':r.inicio.slice(0,7)):"—")+'</span>'
      +'<span class="num">'+(r.cash!==null?money(r.cash):"—")+'</span>'
      +'</div>';
  }).join("") || '<div style="padding:14px" class="ali">Sin clientes.</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".fila"), function(f){
    f.addEventListener("click", function(){ SELECC=f.getAttribute("data-a"); renderLista(); renderDet(); });
  });
}

// ===== gráfico del portafolio =====
async function serieDe(alias, hz){
  var per = hz==="YTD" ? "1A" : hz==="Todo" ? "all" : hz;   // YTD se recorta acá
  var k = alias+"|"+per;
  if(!CACHE_HIST[k]){
    CACHE_HIST[k] = location.hash==="#demo" ? demoSerie(per) : await llamar("historia",{alias:alias, period:per});
  }
  var h = CACHE_HIST[k];
  if(hz!=="YTD") return h;
  var y0 = Date.UTC(new Date().getUTCFullYear(),0,1)/1000, t=[], eq=[], pf=[];
  for(var i=0;i<h.t.length;i++){ if(h.t[i]>=y0){ t.push(h.t[i]); eq.push(h.eq[i]); if(h.perf) pf.push(h.perf[i]); } }
  if(pf.length){ var b=pf[0]; pf=pf.map(function(v){return v/b*100;}); }
  return {t:t, eq:eq, perf:pf};
}
function dibujar(h, hover){
  var cv=$("cv-hist"); if(!cv) return;
  var msg=document.querySelector(".grafico .msg"); if(msg) msg.remove();
  var dpr=Math.max(1,window.devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  var x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  if(!h.t.length){ x.fillStyle="#9AA1AB"; x.font="12px 'Bai Jamjuree'"; x.textAlign="center"; x.fillText("Sin datos en este horizonte", W/2, H/2); return; }
  var serie = (MODOG==="perf" && h.perf && h.perf.length===h.t.length) ? h.perf : h.eq;
  var esPerf = serie!==h.eq;
  var padL=8,padR=8,padT=22,padB=20;
  var mn=Math.min.apply(null,serie), mx=Math.max.apply(null,serie); if(mx<=mn) mx=mn+1;
  var X=function(i){ return padL+(i/(h.t.length-1||1))*(W-padL-padR); };
  var Y=function(v){ return padT+(1-(v-mn)/(mx-mn))*(H-padT-padB); };
  // área + línea
  x.beginPath(); x.moveTo(X(0),Y(serie[0]));
  for(var i=1;i<serie.length;i++) x.lineTo(X(i),Y(serie[i]));
  x.strokeStyle="#63FCAF"; x.lineWidth=2; x.stroke();
  x.lineTo(X(serie.length-1),H-padB); x.lineTo(X(0),H-padB); x.closePath();
  x.fillStyle="rgba(99,252,175,.10)"; x.fill();
  // etiquetas
  var v0=serie[0], v1=serie[serie.length-1], ch=v0>0?(v1/v0-1)*100:0;
  var f0=new Date(h.t[0]*1000).toISOString().slice(0,10), f1=new Date(h.t[h.t.length-1]*1000).toISOString().slice(0,10);
  x.font="700 12px 'Bai Jamjuree'"; x.textAlign="left"; x.fillStyle="#9AA1AB";
  x.fillText(esPerf? f0+" · sin contar aportes" : f0+" · "+money(v0), padL+2, 14);
  x.textAlign="right"; x.fillStyle= ch>=0?"#63FCAF":"#E0525A";
  x.fillText(esPerf? "rendimiento "+pct(ch) : money(v1)+" ("+pct(ch)+")", W-padR-2, 14);
  x.textAlign="left"; x.fillStyle="#9AA1AB"; x.font="10px 'Bai Jamjuree'";
  x.fillText(f1, W-padR-70, H-6);
  // crosshair con el valor bajo el mouse
  if(typeof hover==="number" && hover>=0 && hover<serie.length){
    var hx=X(hover), hy=Y(serie[hover]);
    x.strokeStyle="rgba(255,255,255,.25)"; x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(hx,padT); x.lineTo(hx,H-padB); x.stroke(); x.setLineDash([]);
    x.fillStyle="#FEF9F3"; x.beginPath(); x.arc(hx,hy,3.5,0,7); x.fill();
    var fh=new Date(h.t[hover]*1000).toISOString().slice(0,10);
    var txt= esPerf ? fh+"  "+pct((serie[hover]/serie[0]-1)*100) : fh+"  "+fmt(serie[hover]);
    x.font="700 12px 'Bai Jamjuree'";
    var tw=x.measureText(txt).width+14, bx=Math.min(Math.max(hx-tw/2, padL), W-padR-tw), by=padT+4;
    x.fillStyle="rgba(13,15,20,.92)"; x.strokeStyle="#2a3140";
    x.beginPath(); x.roundRect(bx,by,tw,20,6); x.fill(); x.stroke();
    x.fillStyle= esPerf ? ((serie[hover]>=serie[0])?"#63FCAF":"#E0525A") : "#FEF9F3";
    x.textAlign="left"; x.fillText(txt, bx+7, by+14);
  }
  cv.onmousemove=function(ev){
    var r=cv.getBoundingClientRect(), mx_=ev.clientX-r.left;
    var i=Math.round((mx_-padL)/Math.max(1,(W-padL-padR))*(serie.length-1));
    i=Math.max(0,Math.min(serie.length-1,i));
    dibujar(h, i);
  };
  cv.onmouseleave=function(){ dibujar(h); };
}

function demoSerie(per){
  var dias= per==="1M"?22 : per==="3M"?66 : per==="all"?900 : 252;
  var t=[], eq=[], v=120000, now=Math.floor(Date.now()/1000);
  for(var i=dias;i>=0;i--){ v*=1+(Math.sin(i/9)*0.004+0.0009+(Math.random()-0.5)*0.008);
    t.push(now-i*86400); eq.push(v); }
  var b=eq[0], perf=eq.map(function(x){return x/b*100;});
  return {t:t, eq:eq, perf:perf};
}
