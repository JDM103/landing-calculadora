<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página privada · Empowered Investor</title>
<link rel="icon" href="/assets/logo-fondo-negro.png">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --tinta:#0d0f14; --card:#161a22; --bd:#2a3140; --crema:#FEF9F3; --gris-sec:#9AA1AB; --menta:#63FCAF; --rojo:#E0525A; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:var(--tinta); color:var(--crema); font-family:'Bai Jamjuree',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .caja{ width:100%; max-width:380px; background:var(--card); border:1px solid var(--bd); border-radius:18px;
    padding:30px 26px; text-align:center; }
  .caja img{ height:84px; margin-bottom:14px; }
  .lk{ font-size:30px; }
  h1{ font-size:20px; font-weight:700; margin:8px 0 4px; }
  p{ font-size:14px; color:var(--gris-sec); margin-bottom:18px; }
  input{ width:100%; background:var(--tinta); border:1px solid var(--bd); border-radius:11px; color:var(--crema);
    font-family:inherit; font-size:17px; font-weight:600; padding:13px 14px; text-align:center; letter-spacing:1px; }
  input:focus{ outline:none; border-color:var(--menta); }
  button{ width:100%; margin-top:12px; background:var(--menta); color:#082018; border:none; border-radius:11px;
    font-family:inherit; font-size:16px; font-weight:700; padding:13px; cursor:pointer; }
  button:hover{ filter:brightness(1.06); }
  .err{ display:none; color:var(--rojo); font-size:13.5px; font-weight:600; margin-top:10px; }
</style>
</head>
<body>
<div class="caja">
  <img src="/assets/logo-fondo-negro.png" alt="Empowered Investor">
  <div class="lk">🔒</div>
  <h1>Página privada</h1>
  <p>Ingresá la clave que te compartió Jose.</p>
  <input id="pw" type="password" autocomplete="off" placeholder="Clave" autofocus>
  <button id="go">Entrar →</button>
  <div class="err" id="err">Clave incorrecta. Probá de nuevo.</div>
</div>

function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }
async function abrir(pass){
  var raw=b64(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  var km=await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:150000,hash:"SHA-256"}, km,
    {name:"AES-GCM",length:256}, false, ["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv}, key, ct);
  return new TextDecoder().decode(pt);
}
async function intentar(){
  var pass=document.getElementById("pw").value.trim();
  if(!pass) return;
  try{
    var html=await abrir(pass);
    try{ sessionStorage.setItem("monte_pw", pass); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById("err").style.display="block";
    document.getElementById("pw").select();
  }
}
document.getElementById("go").addEventListener("click", intentar);
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") intentar(); });
// sesión recordada
try{ var s=sessionStorage.getItem("monte_pw"); if(s){ document.getElementById("pw").value=s; intentar(); } }catch(e){}
